<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Devices - AI Network Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-gradient-to-r from-blue-500 to-purple-600 p-2 rounded-lg">
                        <i class="fas fa-brain text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800">AI Network Simulator</h1>
                        <p class="text-xs text-gray-500">Intelligent Network Management</p>
                    </div>
                </div>
                
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="text-gray-600 hover:text-blue-500 focus:outline-none">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
                
                <div class="hidden md:flex items-center space-x-1">
                    <a href="/" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium flex items-center">
                        <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
                    </a>
                    <a href="/devices" class="px-4 py-2 rounded-lg bg-blue-500 text-white font-medium flex items-center">
                        <i class="fas fa-server mr-2"></i>Devices
                    </a>
                    <a href="/config" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium flex items-center">
                        <i class="fas fa-cog mr-2"></i>Configuration
                    </a>
                    <div class="relative group ml-4">
                        <button class="flex items-center space-x-2 bg-gray-100 rounded-lg px-3 py-2 hover:bg-gray-200 transition-colors">
                            <div class="w-8 h-8 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center">
                                <span class="text-white font-bold text-sm">{{ user.user[0] }}</span>
                            </div>
                            <span class="text-gray-700 font-medium">{{ user.user }}</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Header -->
        <div class="mb-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-gray-800">Network Devices 🖥️</h2>
                    <p class="text-gray-600 mt-2">Manage and monitor all network devices</p>
                </div>
                <div class="mt-4 md:mt-0">
                    <div class="flex space-x-3">
                        <button onclick="refreshDevices()" class="bg-white border border-gray-300 rounded-lg px-4 py-2 text-gray-700 hover:bg-gray-50 flex items-center">
                            <i class="fas fa-sync-alt mr-2"></i>Refresh
                        </button>
                        <button onclick="showAddDeviceModal()" class="bg-blue-500 text-white rounded-lg px-4 py-2 hover:bg-blue-600 flex items-center">
                            <i class="fas fa-plus mr-2"></i>Add Device
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Device Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-lg p-4 shadow-sm">
                <div class="flex items-center">
                    <div class="p-2 bg-blue-100 rounded-lg mr-3">
                        <i class="fas fa-server text-blue-500"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">Total Devices</p>
                        <p class="text-xl font-bold text-gray-800" id="total-devices">8</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-sm">
                <div class="flex items-center">
                    <div class="p-2 bg-green-100 rounded-lg mr-3">
                        <i class="fas fa-check-circle text-green-500"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">Active</p>
                        <p class="text-xl font-bold text-gray-800" id="active-devices">6</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-sm">
                <div class="flex items-center">
                    <div class="p-2 bg-yellow-100 rounded-lg mr-3">
                        <i class="fas fa-exclamation-triangle text-yellow-500"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">Warning</p>
                        <p class="text-xl font-bold text-gray-800" id="warning-devices">1</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-sm">
                <div class="flex items-center">
                    <div class="p-2 bg-red-100 rounded-lg mr-3">
                        <i class="fas fa-times-circle text-red-500"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">Down</p>
                        <p class="text-xl font-bold text-gray-800" id="down-devices">1</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Devices Table -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between">
                    <h3 class="text-lg font-bold text-gray-800">All Devices</h3>
                    <div class="mt-2 md:mt-0">
                        <input type="text" id="search-devices" placeholder="Search devices..." 
                               class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Device</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IP Address</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">CPU</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Memory</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="devices-table-body">
                        <!-- Devices will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Device Modal -->
    <div id="addDeviceModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">Add New Device</h3>
                <button onclick="hideAddDeviceModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="addDeviceForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Device Name</label>
                    <input type="text" name="name" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="e.g., Router-1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Device Type</label>
                    <select name="type" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="router">Router</option>
                        <option value="switch">Switch</option>
                        <option value="firewall">Firewall</option>
                        <option value="server">Server</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">IP Address</label>
                    <input type="text" name="ip" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="e.g., 192.168.1.1">
                </div>
                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="hideAddDeviceModal()" 
                            class="px-4 py-2 text-gray-600 hover:text-gray-800">Cancel</button>
                    <button type="submit" 
                            class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">Add Device</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Sample devices data
        const devices = [
            { id: 1, name: 'R1', type: 'router', ip: '192.168.1.1', status: 'active', cpu: 25, memory: 40 },
            { id: 2, name: 'R2', type: 'router', ip: '10.0.0.2', status: 'active', cpu: 45, memory: 65 },
            { id: 3, name: 'SW1', type: 'switch', ip: '192.168.1.2', status: 'active', cpu: 15, memory: 35 },
            { id: 4, name: 'SW2', type: 'switch', ip: '192.168.1.3', status: 'warning', cpu: 85, memory: 75 },
            { id: 5, name: 'FW1', type: 'firewall', ip: '192.168.1.254', status: 'active', cpu: 30, memory: 50 },
            { id: 6, name: 'SRV1', type: 'server', ip: '192.168.1.10', status: 'active', cpu: 60, memory: 70 },
            { id: 7, name: 'SRV2', type: 'server', ip: '192.168.1.11', status: 'down', cpu: 0, memory: 0 },
            { id: 8, name: 'AP1', type: 'access-point', ip: '192.168.1.20', status: 'active', cpu: 10, memory: 25 }
        ];

        function loadDevices() {
            const tbody = document.getElementById('devices-table-body');
            tbody.innerHTML = '';

            devices.forEach(device => {
                const statusColor = {
                    'active': 'bg-green-100 text-green-800',
                    'warning': 'bg-yellow-100 text-yellow-800',
                    'down': 'bg-red-100 text-red-800'
                }[device.status];

                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 h-10 w-10 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                                <i class="fas fa-${getDeviceIcon(device.type)} text-white"></i>
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-medium text-gray-900">${device.name}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900 capitalize">${device.type}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${device.ip}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusColor}">
                            ${device.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="w-16 bg-gray-200 rounded-full h-2 mr-2">
                                <div class="bg-blue-600 h-2 rounded-full" style="width: ${device.cpu}%"></div>
                            </div>
                            <span class="text-sm text-gray-900">${device.cpu}%</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="w-16 bg-gray-200 rounded-full h-2 mr-2">
                                <div class="bg-purple-600 h-2 rounded-full" style="width: ${device.memory}%"></div>
                            </div>
                            <span class="text-sm text-gray-900">${device.memory}%</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="viewDevice(${device.id})" class="text-blue-600 hover:text-blue-900 mr-3">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button onclick="editDevice(${device.id})" class="text-green-600 hover:text-green-900 mr-3">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteDevice(${device.id})" class="text-red-600 hover:text-red-900">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            updateStats();
        }

        function getDeviceIcon(type) {
            const icons = {
                'router': 'router',
                'switch': 'hdd',
                'firewall': 'shield-alt',
                'server': 'server',
                'access-point': 'wifi'
            };
            return icons[type] || 'server';
        }

        function updateStats() {
            const total = devices.length;
            const active = devices.filter(d => d.status === 'active').length;
            const warning = devices.filter(d => d.status === 'warning').length;
            const down = devices.filter(d => d.status === 'down').length;

            document.getElementById('total-devices').textContent = total;
            document.getElementById('active-devices').textContent = active;
            document.getElementById('warning-devices').textContent = warning;
            document.getElementById('down-devices').textContent = down;
        }

        function showAddDeviceModal() {
            document.getElementById('addDeviceModal').classList.remove('hidden');
        }

        function hideAddDeviceModal() {
            document.getElementById('addDeviceModal').classList.add('hidden');
        }

        function refreshDevices() {
            // Simulate API call
            showNotification('Devices refreshed successfully!', 'success');
            loadDevices();
        }

        function viewDevice(id) {
            const device = devices.find(d => d.id === id);
            alert(`Viewing device: ${device.name}\nIP: ${device.ip}\nStatus: ${device.status}`);
        }

        function editDevice(id) {
            const device = devices.find(d => d.id === id);
            alert(`Editing device: ${device.name}`);
        }

        function deleteDevice(id) {
            if (confirm('Are you sure you want to delete this device?')) {
                const index = devices.findIndex(d => d.id === id);
                if (index > -1) {
                    devices.splice(index, 1);
                    loadDevices();
                    showNotification('Device deleted successfully!', 'success');
                }
            }
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg text-white ${
                type === 'success' ? 'bg-green-500' : 'bg-red-500'
            }`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Form submission
        document.getElementById('addDeviceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            const newDevice = {
                id: devices.length + 1,
                name: formData.get('name'),
                type: formData.get('type'),
                ip: formData.get('ip'),
                status: 'active',
                cpu: Math.floor(Math.random() * 30) + 10,
                memory: Math.floor(Math.random() * 40) + 20
            };
            
            devices.push(newDevice);
            loadDevices();
            hideAddDeviceModal();
            this.reset();
            showNotification('Device added successfully!', 'success');
        });

        // Search functionality
        document.getElementById('search-devices').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#devices-table-body tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', loadDevices);
    </script>
</body>
</html>
