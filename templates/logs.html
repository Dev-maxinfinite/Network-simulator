<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs - AI Network Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-gradient-to-r from-blue-500 to-purple-600 p-2 rounded-lg">
                        <i class="fas fa-brain text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800">AI Network Simulator</h1>
                        <p class="text-xs text-gray-500">Intelligent Network Management</p>
                    </div>
                </div>
                
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="text-gray-600 hover:text-blue-500 focus:outline-none">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
                
                <div class="hidden md:flex items-center space-x-1">
                    <a href="/" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium flex items-center">
                        <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
                    </a>
                    <a href="/logs" class="px-4 py-2 rounded-lg bg-blue-500 text-white font-medium flex items-center">
                        <i class="fas fa-clipboard-list mr-2"></i>Logs
                    </a>
                    <a href="/reports" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium flex items-center">
                        <i class="fas fa-chart-pie mr-2"></i>Reports
                    </a>
                    <div class="relative group ml-4">
                        <button class="flex items-center space-x-2 bg-gray-100 rounded-lg px-3 py-2 hover:bg-gray-200 transition-colors">
                            <div class="w-8 h-8 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center">
                                <span class="text-white font-bold text-sm">{{ user.user[0] }}</span>
                            </div>
                            <span class="text-gray-700 font-medium">{{ user.user }}</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Header -->
        <div class="mb-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-gray-800">System Logs 📋</h2>
                    <p class="text-gray-600 mt-2">Monitor and analyze system activities</p>
                </div>
                <div class="mt-4 md:mt-0">
                    <div class="flex space-x-3">
                        <button onclick="exportLogs()" class="bg-white border border-gray-300 rounded-lg px-4 py-2 text-gray-700 hover:bg-gray-50 flex items-center">
                            <i class="fas fa-download mr-2"></i>Export Logs
                        </button>
                        <button onclick="clearLogs()" class="bg-red-500 text-white rounded-lg px-4 py-2 hover:bg-red-600 flex items-center">
                            <i class="fas fa-trash mr-2"></i>Clear Logs
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Log Filters -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Log Level</label>
                    <select id="log-level" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="all">All Levels</option>
                        <option value="info">Info</option>
                        <option value="warning">Warning</option>
                        <option value="error">Error</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Device</label>
                    <select id="log-device" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="all">All Devices</option>
                        <option value="R1">R1</option>
                        <option value="R2">R2</option>
                        <option value="SW1">SW1</option>
                        <option value="system">System</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Date From</label>
                    <input type="datetime-local" id="date-from" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Date To</label>
                    <input type="datetime-local" id="date-to" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
            <div class="flex justify-end mt-4">
                <button onclick="applyFilters()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Apply Filters</button>
            </div>
        </div>

        <!-- Log Statistics -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-lg p-4 shadow-sm">
                <div class="flex items-center">
                    <div class="p-2 bg-blue-100 rounded-lg mr-3">
                        <i class="fas fa-info-circle text-blue-500"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">Info Logs</p>
                        <p class="text-xl font-bold text-gray-800" id="info-count">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-sm">
                <div class="flex items-center">
                    <div class="p-2 bg-yellow-100 rounded-lg mr-3">
                        <i class="fas fa-exclamation-triangle text-yellow-500"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">Warnings</p>
                        <p class="text-xl font-bold text-gray-800" id="warning-count">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-sm">
                <div class="flex items-center">
                    <div class="p-2 bg-red-100 rounded-lg mr-3">
                        <i class="fas fa-times-circle text-red-500"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">Errors</p>
                        <p class="text-xl font-bold text-gray-800" id="error-count">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-sm">
                <div class="flex items-center">
                    <div class="p-2 bg-purple-100 rounded-lg mr-3">
                        <i class="fas fa-bug text-purple-500"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">Critical</p>
                        <p class="text-xl font-bold text-gray-800" id="critical-count">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between">
                    <h3 class="text-lg font-bold text-gray-800">System Logs</h3>
                    <div class="mt-2 md:mt-0">
                        <input type="text" id="search-logs" placeholder="Search logs..." 
                               class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Timestamp</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Level</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Device</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Message</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Source</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="logs-table-body">
                        <!-- Logs will be loaded here -->
                    </tbody>
                </table>
            </div>
            <div class="px-6 py-4 border-t border-gray-200 bg-gray-50">
                <div class="flex justify-between items-center">
                    <div class="text-sm text-gray-600">
                        Showing <span id="showing-count">0</span> of <span id="total-count">0</span> logs
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="previousPage()" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">Previous</button>
                        <button onclick="nextPage()" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">Next</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Real-time Logs Toggle -->
        <div class="fixed bottom-4 right-4">
            <button id="realtime-toggle" onclick="toggleRealtime()" 
                    class="bg-blue-500 text-white p-3 rounded-full shadow-lg hover:bg-blue-600 transition-colors">
                <i class="fas fa-satellite-dish"></i>
            </button>
        </div>
    </div>

    <script>
        // Sample logs data
        const logs = [
            { id: 1, timestamp: '2024-01-15 14:30:25', level: 'info', device: 'R1', message: 'Interface GigabitEthernet0/0 status changed to up', source: 'system' },
            { id: 2, timestamp: '2024-01-15 14:28:12', level: 'warning', device: 'SW1', message: 'High CPU usage detected (85%)', source: 'monitor' },
            { id: 3, timestamp: '2024-01-15 14:25:43', level: 'error', device: 'R2', message: 'OSPF neighbor 10.0.0.1 down', source: 'routing' },
            { id: 4, timestamp: '2024-01-15 14:22:18', level: 'info', device: 'system', message: 'Backup completed successfully', source: 'backup' },
            { id: 5, timestamp: '2024-01-15 14:20:05', level: 'critical', device: 'FW1', message: 'Security policy violation detected', source: 'security' },
            { id: 6, timestamp: '2024-01-15 14:18:37', level: 'info', device: 'R1', message: 'Configuration saved', source: 'config' },
            { id: 7, timestamp: '2024-01-15 14:15:22', level: 'warning', device: 'SW1', message: 'Port GigabitEthernet1/2 flapping', source: 'interface' },
            { id: 8, timestamp: '2024-01-15 14:12:59', level: 'info', device: 'system', message: 'AI model training started', source: 'ai-engine' },
            { id: 9, timestamp: '2024-01-15 14:10:41', level: 'error', device: 'R2', message: 'BGP session with 192.168.1.1 lost', source: 'routing' },
            { id: 10, timestamp: '2024-01-15 14:08:15', level: 'info', device: 'SW1', message: 'VLAN 10 created successfully', source: 'config' }
        ];

        let currentPage = 1;
        const logsPerPage = 8;
        let filteredLogs = [...logs];
        let isRealtime = false;
        let realtimeInterval;

        function loadLogs() {
            const tbody = document.getElementById('logs-table-body');
            tbody.innerHTML = '';

            const startIndex = (currentPage - 1) * logsPerPage;
            const endIndex = startIndex + logsPerPage;
            const pageLogs = filteredLogs.slice(startIndex, endIndex);

            pageLogs.forEach(log => {
                const levelColors = {
                    'info': 'bg-blue-100 text-blue-800',
                    'warning': 'bg-yellow-100 text-yellow-800',
                    'error': 'bg-red-100 text-red-800',
                    'critical': 'bg-purple-100 text-purple-800'
                };

                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${log.timestamp}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${levelColors[log.level]}">
                            ${log.level.toUpperCase()}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${log.device}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${log.message}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${log.source}</td>
                `;
                tbody.appendChild(row);
            });

            updateStats();
            updatePagination();
        }

        function updateStats() {
            const infoCount = filteredLogs.filter(log => log.level === 'info').length;
            const warningCount = filteredLogs.filter(log => log.level === 'warning').length;
            const errorCount = filteredLogs.filter(log => log.level === 'error').length;
            const criticalCount = filteredLogs.filter(log => log.level === 'critical').length;

            document.getElementById('info-count').textContent = infoCount;
            document.getElementById('warning-count').textContent = warningCount;
            document.getElementById('error-count').textContent = errorCount;
            document.getElementById('critical-count').textContent = criticalCount;
        }

        function updatePagination() {
            document.getElementById('showing-count').textContent = 
                Math.min(filteredLogs.length, currentPage * logsPerPage);
            document.getElementById('total-count').textContent = filteredLogs.length;
        }

        function applyFilters() {
            const levelFilter = document.getElementById('log-level').value;
            const deviceFilter = document.getElementById('log-device').value;
            const dateFrom = document.getElementById('date-from').value;
            const dateTo = document.getElementById('date-to').value;

            filteredLogs = logs.filter(log => {
                // Level filter
                if (levelFilter !== 'all' && log.level !== levelFilter) {
                    return false;
                }

                // Device filter
                if (deviceFilter !== 'all' && log.device !== deviceFilter) {
                    return false;
                }

                // Date filters
                if (dateFrom) {
                    const logDate = new Date(log.timestamp.replace(' ', 'T'));
                    const filterDate = new Date(dateFrom);
                    if (logDate < filterDate) return false;
                }

                if (dateTo) {
                    const logDate = new Date(log.timestamp.replace(' ', 'T'));
                    const filterDate = new Date(dateTo);
                    if (logDate > filterDate) return false;
                }

                return true;
            });

            currentPage = 1;
            loadLogs();
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                loadLogs();
            }
        }

        function nextPage() {
            if (currentPage * logsPerPage < filteredLogs.length) {
                currentPage++;
                loadLogs();
            }
        }

        function exportLogs() {
            const dataStr = JSON.stringify(filteredLogs, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `network-logs-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            
            showNotification('Logs exported successfully!', 'success');
        }

        function clearLogs() {
            if (confirm('Are you sure you want to clear all logs? This action cannot be undone.')) {
                filteredLogs = [];
                logs.length = 0;
                loadLogs();
                showNotification('All logs cleared!', 'success');
            }
        }

        function toggleRealtime() {
            isRealtime = !isRealtime;
            const button = document.getElementById('realtime-toggle');
            
            if (isRealtime) {
                button.classList.remove('bg-blue-500');
                button.classList.add('bg-green-500');
                button.innerHTML = '<i class="fas fa-stop"></i>';
                startRealtimeLogs();
                showNotification('Real-time logging enabled', 'info');
            } else {
                button.classList.remove('bg-green-500');
                button.classList.add('bg-blue-500');
                button.innerHTML = '<i class="fas fa-satellite-dish"></i>';
                stopRealtimeLogs();
                showNotification('Real-time logging disabled', 'info');
            }
        }

        function startRealtimeLogs() {
            realtimeInterval = setInterval(() => {
                // Add a new random log entry
                const levels = ['info', 'warning', 'error'];
                const devices = ['R1', 'R2', 'SW1', 'FW1', 'system'];
                const sources = ['system', 'monitor', 'routing', 'security', 'ai-engine'];
                
                const newLog = {
                    id: logs.length + 1,
                    timestamp: new Date().toISOString().replace('T', ' ').substr(0, 19),
                    level: levels[Math.floor(Math.random() * levels.length)],
                    device: devices[Math.floor(Math.random() * devices.length)],
                    message: 'Real-time system activity detected',
                    source: sources[Math.floor(Math.random() * sources.length)]
                };
                
                logs.unshift(newLog);
                if (filteredLogs === logs) {
                    filteredLogs.unshift(newLog);
                }
                
                loadLogs();
            }, 3000);
        }

        function stopRealtimeLogs() {
            if (realtimeInterval) {
                clearInterval(realtimeInterval);
            }
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg text-white ${
                type === 'success' ? 'bg-green-500' : 
                type === 'info' ? 'bg-blue-500' : 'bg-red-500'
            }`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Search functionality
        document.getElementById('search-logs').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            if (searchTerm) {
                filteredLogs = logs.filter(log => 
                    log.message.toLowerCase().includes(searchTerm) ||
                    log.device.toLowerCase().includes(searchTerm) ||
                    log.source.toLowerCase().includes(searchTerm)
                );
            } else {
                filteredLogs = [...logs];
            }
            
            currentPage = 1;
            loadLogs();
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', loadLogs);
    </script>
</body>
</html>
